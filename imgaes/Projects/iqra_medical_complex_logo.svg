<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1008" width="1900" height="1008">
  <defs>
    <linearGradient id="iqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="iqBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="iqTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0eb8a9"/>
      <stop offset="100%" stop-color="#088377"/>
    </linearGradient>
    <radialGradient id="iqGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Corporate White Canvas -->
  <rect width="1900" height="1008" fill="url(#iqBg)"/>
  <rect width="1860" height="968" x="20" y="20" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="950" cy="400" r="480" fill="url(#iqGlow)"/>

  <!-- Minimal Decorative Geometric Accent Lines -->
  <g opacity="0.4">
    <circle cx="950" cy="340" r="260" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="950" cy="340" r="290" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Central Authentic Hospital Logo Lockup -->
  <g transform="translate(950, 340)">
    
    <!-- Medical Cross & Hospital Caduceus Wings -->
    <g transform="translate(0, -65)">
      <!-- Outer Medical Crest Circle -->
      <circle cx="0" cy="0" r="105" fill="#f0f9ff" stroke="#bae6fd" stroke-width="3"/>
      <circle cx="0" cy="0" r="88" fill="url(#iqBlue)"/>

      <!-- Medical Cross -->
      <path d="M -18 -55 L 18 -55 L 18 -18 L 55 -18 L 55 18 L 18 18 L 18 55 L -18 55 L -18 18 L -55 18 L -55 -18 L -18 -18 Z" 
            fill="#ffffff"/>

      <!-- Heartbeat / Care Accent Line -->
      <path d="M -35 0 L -18 0 L -10 -22 L 0 24 L 10 -16 L 18 0 L 35 0" 
            fill="none" stroke="#0eb8a9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hospital Brand Name -->
    <text x="0" y="165" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="900" fill="#0f172a" letter-spacing="3">
      IQRA MEDICAL COMPLEX
    </text>

    <!-- Subtitle / Clinical Field -->
    <text x="0" y="215" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0284c7" letter-spacing="8">
      MULTI-SPECIALTY HOSPITAL &amp; CLINICAL SERVICES
    </text>

    <!-- Minimal Separator Line -->
    <line x1="-180" y1="245" x2="180" y2="245" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="0,240 5,245 0,250 -5,245" fill="#0284c7"/>

    <!-- Doctor & Location Details (Clean Corporate Row) -->
    <text x="0" y="285" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#475569" letter-spacing="2">
      DR. SIDDIQUE HAMID  •  JOHAR TOWN, LAHORE
    </text>

    <!-- Product Attribution -->
    <text x="0" y="325" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0eb8a9" letter-spacing="3">
      POWERED BY INVENTECH OPD-PULSE
    </text>
  </g>

  <!-- Top Corner Corporate Mark -->
  <g transform="translate(80, 70)">
    <circle cx="16" cy="16" r="6" fill="#0284c7"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">HOSPITAL CLIENT IDENTITY</text>
  </g>

  <g transform="translate(1820, 70)">
    <text x="0" y="21" text-anchor="end" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0284c7" letter-spacing="2">OPD-PULSE SYSTEM</text>
  </g>
</svg>
