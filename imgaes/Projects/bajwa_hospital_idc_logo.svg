<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1008" width="1900" height="1008">
  <defs>
    <!-- Executive Clinical Background Gradients -->
    <radialGradient id="idcBg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </radialGradient>

    <!-- Deep Executive Navy & Diagnostic Cyan Gradient -->
    <linearGradient id="idcNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="idcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="idcShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Clean Executive Background -->
  <rect width="1900" height="1008" fill="url(#idcBg)"/>
  <rect x="36" y="36" width="1828" height="936" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="44" y="44" width="1812" height="920" rx="14" fill="none" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Subtle Executive Watermark Emblem in Background -->
  <g opacity="0.03" transform="translate(950, 470) scale(4.2)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M -15 -60 L 15 -60 L 15 -15 L 60 -15 L 60 15 L 15 15 L 15 60 L -15 60 L -15 15 L -60 15 L -60 -15 L -15 -15 Z" fill="#0f172a"/>
  </g>

  <!-- Main Hospital Brand Lockup -->
  <g transform="translate(950, 420)">

    <!-- Authentic Medical Seal & Crest -->
    <g transform="translate(0, -115)" filter="url(#idcShadow)">
      <!-- Outer Concentric Medallion -->
      <circle cx="0" cy="0" r="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="0" cy="0" r="102" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
      <circle cx="0" cy="0" r="92" fill="url(#idcNavy)"/>

      <!-- Inner Precision Diagnostic Aperture Ring -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4 6"/>

      <!-- Classical Medical Cross with Cyan Focal Hub -->
      <path d="M -16 -50 L 16 -50 L 16 -16 L 50 -16 L 50 16 L 16 16 L 16 50 L -16 50 L -16 16 L -50 16 L -50 -16 L -16 -16 Z" 
            fill="#ffffff"/>
      <circle cx="0" cy="0" r="14" fill="url(#idcCyan)"/>

      <!-- Staff of Asclepius & Healing Serpent of Medicine -->
      <g transform="translate(0, 0)">
        <!-- Golden Asclepius Wooden Rod -->
        <line x1="0" y1="-44" x2="0" y2="44" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-44" r="5" fill="#f59e0b"/>

        <!-- Coiled Serpent of Health & Renewal -->
        <path d="M 0 -36 C 14 -32 14 -22 0 -18 C -14 -14 -14 -4 0 0 C 14 4 14 14 0 18 C -14 22 -14 32 0 36" 
              fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Serpent Head -->
        <ellipse cx="2" cy="-38" rx="3.5" ry="2.5" fill="#ffffff"/>
      </g>

      <!-- Laurel Wreath of Clinical Excellence (Left & Right Branches) -->
      <g stroke="#0284c7" fill="#0369a1" opacity="0.95">
        <!-- Left Leaves -->
        <path d="M -96 15 C -110 -5 -105 -35 -92 -55 C -89 -42 -92 -20 -82 -5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <ellipse cx="-94" cy="-45" rx="7" ry="3.5" transform="rotate(-35 -94 -45)"/>
        <ellipse cx="-102" cy="-25" rx="7" ry="3.5" transform="rotate(-15 -102 -25)"/>
        <ellipse cx="-100" cy="-5" rx="7" ry="3.5" transform="rotate(10 -100 -5)"/>
        <ellipse cx="-90" cy="15" rx="7" ry="3.5" transform="rotate(30 -90 15)"/>

        <!-- Right Leaves -->
        <path d="M 96 15 C 110 -5 105 -35 92 -55 C 89 -42 92 -20 82 -5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <ellipse cx="94" cy="-45" rx="7" ry="3.5" transform="rotate(35 94 -45)"/>
        <ellipse cx="102" cy="-25" rx="7" ry="3.5" transform="rotate(15 102 -25)"/>
        <ellipse cx="100" cy="-5" rx="7" ry="3.5" transform="rotate(-10 100 -5)"/>
        <ellipse cx="90" cy="15" rx="7" ry="3.5" transform="rotate(-30 90 15)"/>
      </g>
    </g>

    <!-- Hospital Primary Brand Typography -->
    <text x="0" y="85" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Inter', -apple-system, serif, sans-serif" font-size="56" font-weight="900" fill="#0f172a" letter-spacing="4">
      BAJWA HOSPITAL &amp; IDC
    </text>

    <!-- Clinical Department / Specialty -->
    <text x="0" y="130" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0284c7" letter-spacing="7">
      ADVANCED DIAGNOSTICS, CLINICAL IMAGING &amp; HEALTHCARE
    </text>

    <!-- Clean Architectural Divider -->
    <g transform="translate(0, 160)">
      <line x1="-220" y1="0" x2="-25" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
      <polygon points="0,-6 7,0 0,6 -7,0" fill="#0f172a"/>
      <circle cx="-12" cy="0" r="2.5" fill="#0284c7"/>
      <circle cx="12" cy="0" r="2.5" fill="#0284c7"/>
      <line x1="25" y1="0" x2="220" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <!-- Doctor & Location Information (Clean Executive Typography) -->
    <text x="0" y="202" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1e293b" letter-spacing="3">
      DR. MEHMOOD UL HASSAN  <tspan fill="#0284c7" font-weight="800">•</tspan>  SHAHDARA &amp; JAIL ROAD, LAHORE
    </text>

    <!-- Official OPD-Pulse Software Branding (Clean & Dignified) -->
    <g transform="translate(0, 252)">
      <text x="0" y="0" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="3">
        POWERED BY <tspan fill="#0eb8a9" font-weight="800">INVENTECH OPD-PULSE™</tspan> HEALTHCARE SOFTWARE
      </text>
    </g>
  </g>
</svg>
