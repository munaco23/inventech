<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1008" width="1900" height="1008">
  <defs>
    <linearGradient id="bhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bhBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bhCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0eb8a9"/>
    </linearGradient>
    <radialGradient id="bhGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Corporate White Canvas -->
  <rect width="1900" height="1008" fill="url(#bhBg)"/>
  <rect width="1860" height="968" x="20" y="20" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="950" cy="400" r="480" fill="url(#bhGlow)"/>

  <!-- Minimal Decorative Geometric Accent Lines -->
  <g opacity="0.4">
    <circle cx="950" cy="340" r="260" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="950" cy="340" r="290" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Central Authentic Hospital Logo Lockup -->
  <g transform="translate(950, 335)">
    
    <!-- Medical Crest Emblem -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="0" r="105" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
      <circle cx="0" cy="0" r="88" fill="url(#bhBlue)"/>

      <!-- Medical Cross & Care Shield -->
      <path d="M -18 -55 L 18 -55 L 18 -18 L 55 -18 L 55 18 L 18 18 L 18 55 L -18 55 L -18 18 L -55 18 L -55 -18 L -18 -18 Z" 
            fill="#ffffff"/>

      <!-- Heartbeat / Care Accent Line -->
      <path d="M -35 0 L -18 0 L -10 -22 L 0 24 L 10 -16 L 18 0 L 35 0" 
            fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hospital Brand Name -->
    <text x="0" y="155" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="2">
      BAJWA HOSPITAL
    </text>

    <!-- Joint Hospital Name -->
    <text x="0" y="200" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#1e40af" letter-spacing="2">
      &amp; SAIRA MIRAJ MEMORIAL HOSPITAL
    </text>

    <!-- Subtitle / Clinical Field -->
    <text x="0" y="238" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0284c7" letter-spacing="5">
      SURGICAL, MATERNITY &amp; MULTI-SPECIALTY HEALTHCARE COMPLEX
    </text>

    <!-- Minimal Separator Line -->
    <line x1="-180" y1="265" x2="180" y2="265" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="0,260 5,265 0,270 -5,265" fill="#1e40af"/>

    <!-- Doctor & Location Details (Clean Corporate Row) -->
    <text x="0" y="302" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#475569" letter-spacing="2">
      DR. RIZWAN MEHMOOD  •  SHAHDARA &amp; BEGUM KOT, LAHORE
    </text>

    <!-- Product Attribution -->
    <text x="0" y="340" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0eb8a9" letter-spacing="3">
      POWERED BY INVENTECH OPD-PULSE
    </text>
  </g>

  <!-- Top Corner Corporate Mark -->
  <g transform="translate(80, 70)">
    <circle cx="16" cy="16" r="6" fill="#1e40af"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">HOSPITAL CLIENT IDENTITY</text>
  </g>

  <g transform="translate(1820, 70)">
    <text x="0" y="21" text-anchor="end" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af" letter-spacing="2">OPD-PULSE SYSTEM</text>
  </g>
</svg>
